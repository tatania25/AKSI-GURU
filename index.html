function mk(m,i){return{n:i+1,title:m[0],tp:m[1],body:m[2],sum:'Ringkasan: '+m[2].split('.')[0]+'.',ex:'Contoh soal: Jelaskan penerapan "'+m[0]+'" pada sebuah usaha jasa (salon/bengkel/bimbel) dengan 1 contoh transaksi.',act:'1) Apersepsi & tayangan kasus (10\'); 2) Diskusi kelompok (25\'); 3) Latihan di LKPD (30\'); 4) Refleksi (10\').',media:'Slide, kalkulator, bukti transaksi contoh, laptop/spreadsheet',time:10,lk:'LKPD '+(i+1),quiz:[{q:m[3],t:'mc',o:m[4].split(';'),a:m[5],s:10},{q:m[6],t:'tf',o:['Benar','Salah'],a:m[7],s:10}]}}
// UI utils
function toast(m,ok=true){const e=document.createElement('div');e.textContent=m;if(!ok)e.className='e';$('#toast').append(e);setTimeout(()=>e.remove(),2800)}
function modal(h){$('#modal').innerHTML='<div class="mw" onclick="if(event.target==this)closeM()"><div class="md sp1">'+h+'</div></div>'}function closeM(){$('#modal').innerHTML='';clearInterval(window.tm)}
let CF=null;function ask(msg,fn){CF=fn;modal('<h2>Konfirmasi</h2><p>'+msg+'</p><div class="row"><button class="btn d" onclick="closeM();CF()">Ya, Hapus</button><button class="btn s" onclick="closeM()">Batal</button></div>')}
let FC=null;function form(title,f,v,cb){FC={f,cb};modal('<h2>'+title+'</h2><form onsubmit="return fs(event)" novalidate>'+f.map(x=>'<label>'+x.l+(x.r?' *':'')+'</label>'+(x.t=='area'?'<textarea name="'+x.k+'">'+esc(v[x.k]||'')+'</textarea>':x.t=='select'?'<select name="'+x.k+'">'+x.o.map(o=>{const a=Array.isArray(o)?o:[o,o];return'<option value="'+a[0]+'"'+(v[x.k]==a[0]?' selected':'')+'>'+a[1]+'</option>'}).join('')+'</select>':'<input name="'+x.k+'" type="'+(x.t||'text')+'" value="'+esc(v[x.k]??'')+'">')).join('')+'<div class="row" style="margin-top:16px"><button class="btn">Simpan</button><button type="button" class="btn s" onclick="closeM()">Batal</button></div></form>')}
function fs(e){e.preventDefault();const o={};for(const x of FC.f){const val=e.target.elements[x.k].value.trim();if(x.r&&!val){toast(x.l+' wajib diisi',false);return false}o[x.k]=x.t=='number'?+val:val}FC.cb(o);closeM();save();render();return false}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const bars=(a,mx)=>a.length?a.map(x=>'<div class="bar"><i>'+x[0]+'</i><div style="width:'+Math.max(2,x[1]/(mx||100)*100)*0.62+'%"></div><b>'+x[1]+(mx==100?'':'')+'</b></div>').join(''):'<div class="empty">Belum ada data</div>';
const empty=(t,b)=>'<div class="empty"><big>📭</big>'+t+(b||'')+'</div>';
function printDoc(t,h){$('#pv').innerHTML='<h2>'+t+'</h2>'+h;document.body.classList.add('pr');window.print();document.body.classList.remove('pr')}
const sel=(id,opts,v,fn)=>'<select style="width:auto" onchange="'+fn+'">'+opts.map(o=>'<option value="'+o[0]+'"'+(o[0]==v?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
// Auth
function login(e){e.preventDefault();const u=$('#u').value.trim(),p=$('#p').value;if(u===D.user.username&&p===D.user.pw){SES=true;try{sessionStorage.setItem('aksi_s','1')}catch(x){}P='dash';boot()}else{$('#err').textContent='Username atau password salah. Periksa kembali huruf besar/kecil.'}}
function logout(){SES=false;try{sessionStorage.removeItem('aksi_s')}catch(x){}boot()}
function boot(){if(location.hash=='#siswa')return stuPortal();if(!SES){$('#root').innerHTML='<div class="login"><div class="card lb sp1"><div class="lg">📒</div><h1 style="margin:0">AKSI-GURU</h1><p style="color:var(--mu)">Perangkat Pembelajaran Praktik Akuntansi Perusahaan Jasa Kelas XI</p><form onsubmit="login(event)" style="text-align:left"><label>Username</label><input id="u" autocomplete="username" required><label>Password</label><div class="pw"><input id="p" type="password" autocomplete="current-password" required><button type="button" onclick="let i=$(\'#p\');i.type=i.type==\'password\'?\'text\':\'password\'" aria-label="Tampilkan password">👁</button></div><p id="err" class="no" style="font-size:13px"></p><button class="btn" style="width:100%">Masuk</button></form><div class="hint"><b>Akun demo</b><br>Username: Septania Eka Putri, S.Pd.<br>Password: Septania25<br><button class="btn l x" style="margin-top:6px" onclick="$(\'#u\').value=\''+D.user.username+'\';$(\'#p\').value=\''+D.user.pw+'\'">Isi otomatis</button></div></div></div>';return}
document.documentElement.dataset.theme=D.user.theme;shell();render()}
const NAV=[['dash','🏠','Dashboard Utama'],['kelas','🏫','Kelas & Semester'],['modul','📚','Modul & Perangkat'],['materi','📖','Materi & Pertemuan'],['kuis','📝','Kuis'],['games','🎮','Games'],['lkpd','🧾','Generator LKPD'],['sim','🧮','Simulasi Transaksi'],['siswa','👩‍🎓','Data Siswa'],['hadir','✅','Presensi'],['nilai','📊','Nilai Siswa'],['jadwal','🗓','Jadwal Pelajaran'],['set','⚙️','Pengaturan']];
function shell(){$('#root').innerHTML='<div class="app"><nav class="side" id="sb"><div class="logo"><div class="lg">📒</div><span class="t">AKSI-GURU</span></div>'+NAV.map(n=>'<button class="nv" data-p="'+n[0]+'" onclick="go(\''+n[0]+'\')"><i>'+n[1]+'</i><span class="t">'+n[2]+'</span></button>').join('')+'<button class="nv" onclick="ask(\'Keluar dari akun?\',logout)" style="margin-top:auto"><i>🚪</i><span class="t">Logout</span></button></nav><div class="main"><div class="top"><button class="btn s" onclick="let s=$(\'#sb\');innerWidth<800?s.classList.toggle(\'o\'):s.classList.toggle(\'c\')" aria-label="Ciutkan sidebar">☰</button><span id="ctx"></span></div><div class="pg" id="pg"></div></div></div>'}
function go(p){P=p;$('#sb').classList.remove('o');render()}
function setCls(v){D.cur=v;save();render()}function setSem(v){D.sem=v;save();render()}
function render(){document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('a',b.dataset.p==P));$('#ctx').innerHTML='<span class="row">'+sel('c',D.cls.map(c=>[c.id,c.name]),D.cur,'setCls(this.value)')+sel('s',SEM.map(s=>[s,'Semester '+s]),D.sem,'setSem(this.value)')+'</span>';$('#pg').innerHTML=({dash,kelas,modul,materi,kuis,games,lkpd,sim,siswa,hadir,nilai,jadwal,set})[P]();$('#pg').classList.add('sp1');setTimeout(()=>$('#pg').classList.remove('sp1'),500)}
// Pages
function dash(){const u=D.user,all=D.stu.length,keys=Object.keys(D.att),hp=keys.length?Math.round(keys.filter(k=>D.att[k]=='Hadir').length/keys.length*100):0,mt=Object.values(getM(D.cur)),today=DAYS[(new Date().getDay()+6)%7];const sc=D.sch.filter(s=>s.day==today);const ng=Object.keys(D.gr).map(fin);
const st=[['🏫',D.cls.length,'Kelas diampu'],['📅','Smt '+D.sem,'Semester aktif'],['📖',mt.length,'Materi/pertemuan'],['🧾',D.lk.length,'LKPD'],['📝',mt.reduce((a,m)=>a+m.quiz.length,0),'Soal kuis (kelas ini)'],['👩‍🎓',all,'Siswa'],['✅',hp+'%','Kehadiran'],['⭐',avg(ng),'Rata-rata nilai akhir']];
return '<div class="card hero"><div class="av">'+(u.foto?'<img src="'+esc(u.foto)+'">':'👩‍🏫')+'</div><div><h1 style="margin:0">Selamat Datang, '+u.name+', '+u.gelar+'</h1><span>'+u.mapel+' • '+u.school+'</span></div></div>'
+'<div class="g">'+st.map(s=>'<div class="st"><span>'+s[0]+' '+s[2]+'</span><b>'+s[1]+'</b></div>').join('')+'</div><h2 style="margin-top:20px">Akses cepat</h2><div class="row" style="margin-bottom:16px">'+[['Buat Perangkat Pembelajaran','modul'],['Buat LKPD','lkpd'],['Buat Kuis','kuis'],['Simulasi Transaksi','sim'],['Unggah Nilai','nilai'],['Presensi','hadir']].map(b=>'<button class="btn l" onclick="go(\''+b[1]+'\')">'+b[0]+'</button>').join('')+'</div>'
+'<div class="g2"><div class="card"><h2>Jadwal hari ini ('+today+')</h2>'+(sc.length?sc.map(s=>'<p><b>'+s.time+'</b> • '+cn(s.cls)+' • '+s.topic+' <span class="tag">'+s.room+'</span></p>').join(''):empty('Tidak ada jadwal hari ini'))+'<h2>Jadwal terdekat</h2>'+D.sch.slice(0,3).map(s=>'<p>'+s.day+' '+s.time+' – '+cn(s.cls)+': '+s.topic+'</p>').join('')+'</div><div class="card"><h2>Aktivitas terbaru</h2>'+D.log.slice(0,6).map(l=>'<p>• '+l+'</p>').join('')+'</div>'
+'<div class="card"><h2>Siswa per kelas</h2>'+bars(D.cls.map(c=>[c.name,stu(c.id).length]),12)+'</div><div class="card"><h2>Kehadiran per kelas (%)</h2>'+bars(D.cls.map(c=>[c.name,attPct(c.id)]),100)+'</div><div class="card"><h2>Rata-rata nilai akhir per kelas</h2>'+bars(D.cls.map(c=>[c.name,avg(stu(c.id).map(s=>fin(s.id)))]),100)+'</div><div class="card"><h2>Perkembangan nilai ('+cn(D.cur)+')</h2>'+bars(CAT.map(k=>[k,avg(stu().map(s=>D.gr[s.id][k]||0))]),100)+'</div></div>'}
function attPct(c){const k=Object.keys(D.att).filter(x=>x.startsWith(c+'|'));return k.length?Math.round(k.filter(x=>D.att[x]=='Hadir').length/k.length*100):0}
function log(t){D.log.unshift(t);D.log=D.log.slice(0,20)}
function kelas(){return '<h1>Kelas & Semester</h1><button class="btn" onclick="addCls()">Tambah Kelas</button> <button class="btn l" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href.split(\'#\')[0]+\'#siswa\');toast(\'Tautan akses siswa disalin\')">Salin Tautan Siswa</button><div class="g" style="margin-top:14px">'+(D.cls.map(c=>'<div class="card"><h2>'+c.name+'</h2><span class="tag">Semester '+c.sem+'</span><p>'+stu(c.id).length+' siswa • '+attPct(c.id)+'% hadir</p><div class="row"><button class="btn x" onclick="setCls(\''+c.id+'\');go(\'materi\')">Buka Workspace</button><button class="btn s x" onclick="editCls(\''+c.id+'\')">Edit</button><button class="btn d x" onclick="delCls(\''+c.id+'\')">Hapus</button></div></div>').join('')||empty('Belum ada kelas'))+'</div><p style="color:var(--mu)">Setiap kelas punya data siswa, presensi, nilai, materi, dan kuis sendiri.</p>'}
const CF_=[{k:'name',l:'Nama kelas',r:1},{k:'sem',l:'Semester',t:'select',o:SEM}];
function addCls(){form('Tambah Kelas',CF_,{sem:'Ganjil'},o=>{const id='c'+uid();D.cls.push({id,...o});D.cur=id;log('Kelas '+o.name+' ditambahkan');toast('Kelas ditambahkan')})}
function editCls(id){const c=D.cls.find(x=>x.id==id);form('Edit Kelas',CF_,c,o=>{Object.assign(c,o);toast('Kelas diperbarui')})}
function delCls(id){ask('Hapus kelas '+cn(id)+' beserta siswa & datanya?',()=>{D.stu.filter(s=>s.cls==id).forEach(s=>delete D.gr[s.id]);D.stu=D.stu.filter(s=>s.cls!=id);D.cls=D.cls.filter(c=>c.id!=id);delete D.meet[id];D.sch=D.sch.filter(s=>s.cls!=id);if(D.cur==id)D.cur=(D.cls[0]||{}).id;save();render();toast('Kelas dihapus')})}
// Modul
let MQ='',MT='';
const tpl=(t,c)=>t+' – Praktik Akuntansi Perusahaan Jasa Kelas XI\nKelas: '+c+'\n\n1. Capaian: peserta didik mampu menganalisis transaksi, menyusun jurnal, buku besar, neraca saldo, penyesuaian, kertas kerja, laporan keuangan, dan penutupan.\n2. Alur: Karakteristik perusahaan jasa → Bukti transaksi → Analisis → Jurnal → Posting → Neraca saldo → Penyesuaian → Kertas kerja → Laporan → Penutup.\n3. Asesmen: kuis tiap pertemuan, LKPD studi kasus, praktik, UTS, UAS.\n(Silakan edit sesuai kebutuhan)';
function modul(){const l=D.mod.filter(m=>m.cls==D.cur&&m.sem==D.sem&&(!MT||m.type==MT)&&m.title.toLowerCase().includes(MQ.toLowerCase()));
return '<h1>Modul & Perangkat Pembelajaran</h1><div class="row"><input style="max-width:230px" placeholder="Cari perangkat…" value="'+esc(MQ)+'" oninput="MQ=this.value;render();$(\'#pg input\').focus()"> '+sel('t',[['','Semua jenis']].concat(MOD.map(m=>[m,m])),MT,'MT=this.value;render()')+'<button class="btn" onclick="newMod(0)">Buat Baru</button></div><h2 style="margin-top:16px">Template siap pakai</h2><div class="row">'+MOD.map(m=>'<button class="btn l x" onclick="newMod(\''+m+'\')">Gunakan Template: '+m+'</button>').join('')+'</div><h2 style="margin-top:18px">Tersimpan – '+cn(D.cur)+' / Smt '+D.sem+'</h2><div class="g">'+(l.map(m=>'<div class="card"><span class="tag">'+m.type+'</span><h2 style="margin-top:8px">'+esc(m.title)+'</h2><p style="color:var(--mu);font-size:12px">'+esc(m.topic)+'</p><div class="row"><button class="btn x" onclick="pvMod(\''+m.id+'\')">Preview</button><button class="btn s x" onclick="editMod(\''+m.id+'\')">Edit</button><button class="btn s x" onclick="dupMod(\''+m.id+'\')">Duplikasi</button><button class="btn l x" onclick="regMod(\''+m.id+'\')">Buat Ulang</button><button class="btn d x" onclick="delMod(\''+m.id+'\')">Hapus</button></div></div>').join('')||'<div class="card" style="grid-column:1/-1">'+empty('Belum ada perangkat untuk kelas & semester ini')+'</div>')+'</div>'}
const MF=[{k:'type',l:'Jenis perangkat',t:'select',o:MOD},{k:'title',l:'Judul',r:1},{k:'topic',l:'Mata pelajaran / Topik / Pertemuan'},{k:'body',l:'Isi',t:'area'}];
function newMod(t){form(t?'Template '+t:'Buat Perangkat Baru',MF,{type:t||MOD[2],title:t?t+' '+cn(D.cur):'',topic:'Praktik Akuntansi – Pertemuan 1',body:t?tpl(t,cn(D.cur)):''},o=>{D.mod.unshift({id:uid(),cls:D.cur,sem:D.sem,...o});log(o.title+' disimpan');toast('Perangkat disimpan')})}
const gm=id=>D.mod.find(m=>m.id==id);
function editMod(id){const m=gm(id);form('Edit Perangkat',MF,m,o=>{Object.assign(m,o);toast('Perubahan disimpan')})}
function dupMod(id){const m=gm(id);D.mod.unshift({...m,id:uid(),title:m.title+' (Salinan)'});save();render();toast('Perangkat diduplikasi')}
function regMod(id){const m=gm(id);m.body=tpl(m.type,cn(m.cls));save();render();toast('Isi dibuat ulang dari template')}
function delMod(id){ask('Hapus perangkat ini?',()=>{D.mod=D.mod.filter(m=>m.id!=id);save();render();toast('Perangkat dihapus')})}
function pvMod(id){const m=gm(id);window.cm=m;modal('<h2>'+esc(m.title)+'</h2><div class="pre">'+esc(m.body)+'</div><div class="row" style="margin-top:14px"><button class="btn" onclick="printDoc(cm.title,\'<div style=white-space:pre-wrap>\'+esc(cm.body)+\'</div>\')">Download PDF</button><button class="btn s" onclick="closeM()">Tutup</button></div>')}
// Materi
function materi(){const m=getM(D.cur);return '<h1>Materi & Pertemuan – '+cn(D.cur)+'</h1><button class="btn" onclick="addM()">Tambah Pertemuan</button><div style="margin-top:14px">'+(m.map((x,i)=>'<details class="card"><summary style="cursor:pointer;font-weight:700">Pertemuan '+x.n+': '+esc(x.title)+'</summary><div class="pre"><b>Tujuan:</b> '+esc(x.tp)+'\n<b>Materi:</b> '+esc(x.body)+'\n<b>Ringkasan:</b> '+esc(x.sum)+'\n<b>Contoh soal:</b> '+esc(x.ex)+'\n<b>Aktivitas:</b> '+esc(x.act)+'\n<b>Media:</b> '+esc(x.media)+'\n<b>Kuis:</b> '+x.quiz.length+' soal • <b>LKPD:</b> '+esc(x.lk)+'</div><div class="row" style="margin-top:10px"><button class="btn s x" onclick="editM('+i+')">Edit</button><button class="btn l x" onclick="regM('+i+')">Buat Ulang</button><button class="btn x" onclick="go(\'kuis\');QM='+i+';render()">Kuis</button><button class="btn d x" onclick="delM('+i+')">Hapus</button></div></details>').join('')||empty('Belum ada pertemuan'))+'</div>'}
const MFm=[{k:'title',l:'Judul materi',r:1},{k:'tp',l:'Tujuan pembelajaran',t:'area'},{k:'body',l:'Materi',t:'area'},{k:'sum',l:'Ringkasan',t:'area'},{k:'ex',l:'Contoh soal',t:'area'},{k:'act',l:'Aktivitas pembelajaran',t:'area'},{k:'media',l:'Media pembelajaran'},{k:'lk',l:'LKPD terkait'}];
function addM(){const a=getM(D.cur);form('Tambah Pertemuan',MFm,{},o=>{const m=mk(['','','','','','','',''],a.length);Object.assign(m,o,{n:a.length+1,quiz:[]});a.push(m);toast('Pertemuan ditambahkan')})}
function editM(i){const m=getM(D.cur)[i];form('Edit Materi',MFm,m,o=>{Object.assign(m,o);toast('Materi disimpan')})}
function regM(i){const a=getM(D.cur);if(M[i]){a[i]=mk(M[i],i)}else{a[i]=Object.assign(a[i],{sum:'Ringkasan: '+a[i].title,quiz:[]})}save();render();toast('Materi dibuat ulang')}
function delM(i){ask('Hapus pertemuan ini?',()=>{const a=getM(D.cur);a.splice(i,1);a.forEach((x,j)=>x.n=j+1);save();render();toast('Pertemuan dihapus')})}
// Kuis
let QM=0;const POOL=[['Persamaan dasar akuntansi yang benar adalah ...','mc',['Aset = Kewajiban + Ekuitas','Aset = Beban + Modal','Modal = Aset + Utang'],'Aset = Kewajiban + Ekuitas'],['Bengkel menerima uang jasa Rp1.000.000. Akun yang didebit?','mc',['Kas','Piutang','Modal'],'Kas'],['Akun Prive bersaldo normal debit.','tf',['Benar','Salah'],'Benar'],['Akun yang memiliki saldo normal kredit pada kelompok pendapatan adalah Pendapatan ...','fill',[],'jasa']];
function kuis(){const a=getM(D.cur),m=a[QM]||a[0];if(!m)return '<h1>Kuis</h1>'+empty('Tambahkan pertemuan terlebih dahulu');const tot=m.quiz.reduce((s,q)=>s+q.s,0);
return '<h1>Kuis per Pertemuan</h1><div class="row">'+sel('m',a.map((x,i)=>[i,'P'+x.n+' – '+x.title]),QM,'QM=+this.value;render()')+'<button class="btn" onclick="addQ()">Tambah Soal</button><button class="btn l" onclick="autoQ()">Buat Kuis Otomatis</button><button class="btn s" onclick="cfgQ()">Waktu: '+m.time+' menit</button><button class="btn" onclick="takeQ()">Uji Kuis</button></div><p>Jumlah soal: <b>'+m.quiz.length+'</b> • Total skor: <b>'+tot+'</b></p>'+(m.quiz.map((q,i)=>'<div class="card"><span class="tag">'+({mc:'Pilihan ganda',tf:'Benar/Salah',fill:'Isian singkat',case:'Kasus'})[q.t]+'</span> <span class="tag g1">Skor '+q.s+'</span><p><b>'+(i+1)+'. '+esc(q.q)+'</b></p>'+(q.o.length?'<p style="color:var(--mu)">'+q.o.map(esc).join(' | ')+'</p>':'')+'<p class="ok">Jawaban: '+esc(q.a)+'</p><div class="row"><button class="btn s x" onclick="editQ('+i+')">Edit</button><button class="btn d x" onclick="delQ('+i+')">Hapus</button></div></div>').join('')||empty('Belum ada soal. Coba “Buat Kuis Otomatis”.'))}
const QF=[{k:'q',l:'Pertanyaan',t:'area',r:1},{k:'t',l:'Jenis soal',t:'select',o:[['mc','Pilihan ganda'],['tf','Benar/Salah'],['fill','Isian singkat'],['case','Berbasis kasus']]},{k:'os',l:'Pilihan (pisahkan dengan ;) – kosongkan untuk isian'},{k:'a',l:'Jawaban benar',r:1},{k:'s',l:'Skor',t:'number',r:1}];
const qv=q=>({q:q.q,t:q.t,os:q.o.join(';'),a:q.a,s:q.s});
function qo(o){const q={q:o.q,t:o.t,o:o.t=='tf'?['Benar','Salah']:o.os?o.os.split(';').map(x=>x.trim()):[],a:o.a,s:o.s||10};return q}
function addQ(){form('Tambah Soal',QF,{t:'mc',s:10},o=>{getM(D.cur)[QM].quiz.push(qo(o));toast('Soal ditambahkan')})}
function editQ(i){const a=getM(D.cur)[QM].quiz;form('Edit Soal',QF,qv(a[i]),o=>{a[i]=qo(o);toast('Soal diperbarui')})}
function delQ(i){ask('Hapus soal ini?',()=>{getM(D.cur)[QM].quiz.splice(i,1);save();render();toast('Soal dihapus')})}
function cfgQ(){const m=getM(D.cur)[QM];form('Batas waktu kuis',[{k:'time',l:'Menit',t:'number',r:1}],m,o=>{m.time=Math.max(1,o.time);toast('Batas waktu disimpan')})}
function autoQ(){const m=getM(D.cur)[QM];const p=POOL[Math.floor(Math.random()*POOL.length)];m.quiz.push({q:p[0],t:p[1],o:p[2],a:p[3],s:10});m.quiz.push({q:'Kasus: Perusahaan jasa menerima kas dari pelanggan terkait "'+m.title+'". Apakah pernyataan "transaksi ini memengaruhi minimal dua akun" benar?',t:'tf',o:['Benar','Salah'],a:'Benar',s:10});save();render();toast('2 soal otomatis dibuat')}
function takeQ(fixedSid){const m=getM(fixedSid?stuOf(fixedSid).cls:D.cur)[QM];window.CQ=m;window.CS=fixedSid;if(!m.quiz.length)return toast('Belum ada soal',false);let left=m.time*60;
modal('<h2>'+esc(m.title)+' <span class="tag" id="cd"></span></h2><form id="qf" onsubmit="return subQ(event)">'+(fixedSid?'':'<label>Siswa</label><select id="qs">'+stu().map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('')+'</select>')+m.quiz.map((q,i)=>'<p><b>'+(i+1)+'. '+esc(q.q)+'</b></p>'+(q.o.length?q.o.map(o=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+esc(o)+'">'+esc(o)+'</label>').join(''):'<input name="q'+i+'" placeholder="Jawaban singkat">')).join('')+'<div class="row" style="margin-top:12px"><button class="btn">Kumpulkan</button><button type="button" class="btn s" onclick="closeM()">Tutup</button></div></form>');
const tick=()=>{const e=$('#cd');if(e)e.textContent='⏱ '+pad(Math.floor(left/60))+':'+pad(left%60);if(left--<=0){clearInterval(window.tm);const f=$('#qf');if(f)f.requestSubmit()}};tick();window.tm=setInterval(tick,1000)}
function subQ(e){e.preventDefault();clearInterval(window.tm);const m=CQ;let g=0,t=0;m.quiz.forEach((q,i)=>{t+=q.s;const el=e.target.elements['q'+i];let v=el.value!==undefined&&!el.length?el.value:(e.target.querySelector('input[name=q'+i+']:checked')||{}).value;if((v||'').trim().toLowerCase()==q.a.toLowerCase())g+=q.s});const sc=Math.round(g/t*100),sid=CS||$('#qs').value;
D.qres=D.qres.filter(r=>!(r.sid==sid&&r.m==m.n));D.qres.push({sid,m:m.n,score:sc});D.gr[sid].Kuis=Math.round(avg(D.qres.filter(r=>r.sid==sid).map(r=>r.score)));log('Nilai kuis '+stuOf(sid).name+': '+sc);save();modal('<h2>Nilai: '+sc+'</h2><p>'+(sc>=75?'Bagus, kamu tuntas!':'Belum tuntas, pelajari materi lalu coba lagi.')+'</p><p>Hasil tersimpan atas nama '+esc(stuOf(sid).name)+' ('+cn(stuOf(sid).cls)+').</p><button class="btn" onclick="closeM();boot()">Tutup</button>');return false}
const stuOf=id=>D.stu.find(s=>s.id==id);
// Games
let GS={};
function games(){return '<h1>Games Akuntansi</h1><div class="g">'+Object.keys(GM).map(k=>'<div class="card" style="background:var(--lvs)"><div style="font-size:34px">🎲</div><h2>'+k+'</h2><button class="btn" onclick="gStart(\''+k+'\')">Mulai Main</button></div>').join('')+'<div class="card"><div style="font-size:34px">🏁</div><h2>Quiz Race</h2><p>Semua game punya skor & timer. Proyeksikan ke kelas dan bagi tim!</p></div></div>'+'<div id="gm"></div>'}
function gStart(k){GS={k,i:0,s:0};gShow()}
function gShow(){const q=GM[GS.k][GS.i];const e=$('#gm');if(!q){e.innerHTML='<div class="card"><h2>Selesai! Skor: '+GS.s+'/'+GM[GS.k].length+'</h2><button class="btn" onclick="gStart(\''+GS.k+'\')">Main Lagi</button></div>';return}
e.innerHTML='<div class="card sp1"><span class="tag">'+GS.k+' • Soal '+(GS.i+1)+'/'+GM[GS.k].length+' • Skor '+GS.s+'</span><h2 style="margin-top:10px">'+q[0]+'</h2><div class="row">'+q[1].map((o,i)=>'<button class="btn s" onclick="gAns('+i+')">'+o+'</button>').join('')+'</div><p id="gf"></p></div>'}
function gAns(i){const q=GM[GS.k][GS.i],ok=i==q[2];if(ok)GS.s++;$('#gf').innerHTML=ok?'<span class="ok">✔ Benar!</span>':'<span class="no">✘ Salah. Jawaban: '+q[1][q[2]]+'</span>';GS.i++;setTimeout(gShow,1100)}
// LKPD
let LH=false;
function lkpd(){return '<h1>Generator LKPD Studi Kasus</h1><div class="row"><button class="btn" onclick="addLk()">Buat Studi Kasus Baru</button><label class="row" style="margin:0"><input type="checkbox" style="width:auto" '+(LH?'checked':'')+' onchange="LH=this.checked;render()">Sembunyikan kunci jawaban (mode siswa)</label></div><div class="g2" style="margin-top:14px">'+D.lk.map(l=>'<div class="card"><span class="tag">'+l.lv+'</span><h2 style="margin-top:8px">'+esc(l.title)+'</h2><p>'+esc(l.desc)+'</p>'+(LH?'':'<div class="key"><b>🔒 Kunci guru</b><br>'+esc(l.key).replace(/\n/g,'<br>')+'</div>')+'<div class="row" style="margin-top:10px"><button class="btn x" onclick="pvLk(\''+l.id+'\')">Preview</button><button class="btn s x" onclick="editLk(\''+l.id+'\')">Edit</button><button class="btn l x" onclick="dlLk(\''+l.id+'\',0)">Download PDF</button><button class="btn d x" onclick="delLk(\''+l.id+'\')">Hapus</button></div></div>').join('')+'</div>'}
const LF=[{k:'title',l:'Judul',r:1},{k:'lv',l:'Tingkat kesulitan',t:'select',o:['Dasar','Menengah','Lanjutan']},{k:'desc',l:'Deskripsi perusahaan',t:'area',r:1},{k:'trx',l:'Data transaksi',t:'area'},{k:'q',l:'Pertanyaan',t:'area'},{k:'ins',l:'Instruksi pengerjaan',t:'area'},{k:'key',l:'Kunci jawaban (hanya guru)',t:'area'}];
function addLk(){form('Studi Kasus Baru',LF,{lv:'Dasar'},o=>{D.lk.push({id:uid(),...o});toast('LKPD disimpan')})}
function editLk(id){const l=D.lk.find(x=>x.id==id);form('Edit Studi Kasus',LF,l,o=>{Object.assign(l,o);toast('LKPD disimpan')})}
function delLk(id){ask('Hapus LKPD ini?',()=>{D.lk=D.lk.filter(l=>l.id!=id);save();render();toast('LKPD dihapus')})}
const lkH=(l,k)=>'<p><b>'+esc(l.desc)+'</b></p><p><b>Data transaksi</b></p><div class="pre">'+esc(l.trx)+'</div><p><b>Pertanyaan</b></p><div class="pre">'+esc(l.q)+'</div><p><b>Instruksi:</b> '+esc(l.ins)+'</p>'+(k?'<div class="key pre"><b>Kunci jawaban</b>\n'+esc(l.key)+'</div>':'');
function pvLk(id){const l=D.lk.find(x=>x.id==id);modal('<h2>'+esc(l.title)+'</h2>'+lkH(l,!LH)+'<div class="row" style="margin-top:12px"><button class="btn" onclick="dlLk(\''+id+'\')">Download PDF</button><button class="btn s" onclick="closeM()">Tutup</button></div>')}
function dlLk(id){const l=D.lk.find(x=>x.id==id);printDoc(l.title+' ('+l.lv+')',lkH(l,!LH))}
// Simulasi
let SL=0,SA={};
function sim(){const L=SIM[SL];return '<h1>Simulasi Transaksi</h1><div class="row">'+SIM.map((s,i)=>'<button class="btn '+(i==SL?'':'s')+'" onclick="SL='+i+';SA={};render()">'+s.n+'</button>').join('')+'</div><div class="card" style="margin-top:14px"><p><b>Skenario:</b> '+L.s+'</p>'+L.t.map((t,i)=>'<div class="card" style="background:var(--bs)"><b>'+(i+1)+'. '+t[0]+'</b><div class="row" style="margin-top:8px"><label>Debit</label><select style="width:auto" id="d'+i+'">'+['-- pilih akun --'].concat(ACC).map(a=>'<option>'+a+'</option>').join('')+'</select><label>Kredit</label><select style="width:auto" id="k'+i+'">'+['-- pilih akun --'].concat(ACC).map(a=>'<option>'+a+'</option>').join('')+'</select><span id="f'+i+'"></span></div></div>').join('')+'<div class="row"><button class="btn" onclick="chk()">Periksa Jawaban</button><button class="btn l" onclick="SA={};render()">Ulangi</button><button class="btn s" onclick="$(\'#sk\').style.display=\'block\'">Kunci Guru</button></div><h2 id="sc" style="margin-top:12px"></h2><div id="sk" class="key" style="display:none"><b>🔒 Kunci jawaban guru</b><br>'+L.t.map((t,i)=>(i+1)+'. D: '+t[1]+' / K: '+t[2]).join('<br>')+'</div></div>'}
function chk(){const L=SIM[SL];let p=0;L.t.forEach((t,i)=>{const d=$('#d'+i).value==t[1],k=$('#k'+i).value==t[2];p+=d+k;$('#f'+i).innerHTML=(d?'<span class="ok">Debit ✔</span>':'<span class="no">Debit ✘</span>')+' '+(k?'<span class="ok">Kredit ✔</span>':'<span class="no">Kredit ✘</span>')});const s=Math.round(p/(L.t.length*2)*100);$('#sc').innerHTML='Skor: '+s+' '+(s==100?'🏆 Sempurna!':s>=70?'👍 Bagus!':'💪 Coba lagi, perhatikan akun yang bertambah/berkurang.');log('Simulasi '+L.n+' skor '+s)}
// Siswa
let SQ='';
function siswa(){const l=stu().filter(s=>(s.name+s.nis).toLowerCase().includes(SQ.toLowerCase()));return '<h1>Data Siswa – '+cn(D.cur)+'</h1><div class="row"><input style="max-width:230px" placeholder="Cari nama / NIS…" value="'+esc(SQ)+'" oninput="SQ=this.value;render();$(\'#pg input\').focus()"><button class="btn" onclick="addS()">Tambah Siswa</button><button class="btn l" onclick="impS()">Impor Data</button></div><div class="card tw" style="margin-top:14px"><table><tr><th>No</th><th>NIS/NISN</th><th>Nama</th><th>Kelas</th><th>L/P</th><th>Status</th><th></th></tr>'+(l.map((s,i)=>'<tr><td>'+(i+1)+'</td><td>'+s.nis+'</td><td>'+esc(s.name)+'</td><td>'+cn(s.cls)+'</td><td>'+s.jk+'</td><td><span class="tag g1">'+s.st+'</span></td><td><button class="btn s x" onclick="editS(\''+s.id+'\')">Edit</button> <button class="btn d x" onclick="delS(\''+s.id+'\')">Hapus</button></td></tr>').join('')||'<tr><td colspan=7>'+empty('Belum ada siswa')+'</td></tr>')+'</table></div>'}
const SF=[{k:'nis',l:'NIS/NISN',r:1},{k:'name',l:'Nama siswa',r:1},{k:'jk',l:'Jenis kelamin',t:'select',o:[['L','Laki-laki'],['P','Perempuan']]},{k:'st',l:'Status',t:'select',o:['Aktif','Pindah','Cuti']}];
function addS(){form('Tambah Siswa',SF,{jk:'L',st:'Aktif'},o=>{if(D.stu.some(s=>s.nis==o.nis)){toast('NIS sudah terdaftar',false);return}const id='s'+uid();D.stu.push({id,cls:D.cur,...o});D.gr[id]={};toast('Siswa ditambahkan')})}
function editS(id){const s=stuOf(id);form('Edit Siswa',SF,s,o=>{Object.assign(s,o);toast('Data siswa diperbarui')})}
function delS(id){ask('Hapus siswa ini beserta nilainya?',()=>{D.stu=D.stu.filter(s=>s.id!=id);delete D.gr[id];save();render();toast('Siswa dihapus')})}
function impS(){form('Impor Data Siswa',[{k:'t',l:'Tempel data: NIS,Nama,L/P (satu siswa per baris)',t:'area',r:1}],{},o=>{let n=0;o.t.split('\n').forEach(r=>{const c=r.split(',').map(x=>x.trim());if(c.length>=2&&c[0]&&c[1]&&!D.stu.some(s=>s.nis==c[0])){const id='s'+uid();D.stu.push({id,cls:D.cur,nis:c[0],name:c[1],jk:c[2]=='P'?'P':'L',st:'Aktif'});D.gr[id]={};n++}});toast(n+' siswa diimpor',n>0)})}
// Presensi
let AD=new Date().toISOString().slice(0,10);
function hadir(){const l=stu(),rk=k=>D.att[D.cur+'|'+AD+'|'+k]||'';const rec=l.map(s=>{const ks=Object.keys(D.att).filter(k=>k.startsWith(D.cur+'|')&&k.endsWith('|'+s.id));return[s.name.split(' ')[0],ks.length?Math.round(ks.filter(k=>D.att[k]=='Hadir').length/ks.length*100):0,ks.length,ST.map(t=>ks.filter(k=>D.att[k]==t).length)]});
return '<h1>Presensi – '+cn(D.cur)+'</h1><div class="row"><input type="date" style="width:auto" value="'+AD+'" onchange="AD=this.value;render()">'+sel('p',getM(D.cur).map((m,i)=>[i,'Pertemuan '+m.n]),0,'')+'<button class="btn s" onclick="toast(\'Tersimpan otomatis\')">Simpan</button></div><div class="card tw" style="margin-top:14px"><table><tr><th>Nama</th>'+ST.map(t=>'<th>'+t+'</th>').join('')+'</tr>'+l.map(s=>'<tr><td>'+esc(s.name)+'</td>'+ST.map(t=>'<td><input type="radio" style="width:auto" name="a'+s.id+'" '+(rk(s.id)==t?'checked':'')+' onchange="D.att[\''+D.cur+'|'+AD+'|'+s.id+'\']=\''+t+'\';save();toast(\'Presensi disimpan\')"></td>').join('')+'</tr>').join('')+'</table></div><div class="g2"><div class="card"><h2>Rekap per siswa</h2><table><tr><th>Nama</th><th>H</th><th>I</th><th>S</th><th>A</th><th>%</th></tr>'+rec.map(r=>'<tr><td>'+r[0]+'</td>'+r[3].map(x=>'<td>'+x+'</td>').join('')+'<td><b>'+r[1]+'%</b></td></tr>').join('')+'</table></div><div class="card"><h2>Grafik kehadiran (%)</h2>'+bars(rec.map(r=>[r[0],r[1]]),100)+'</div></div>'}
// Nilai
function nilai(){const l=stu();const rk=CAT.map(k=>avg(l.map(s=>D.gr[s.id][k]||0)));return '<h1>Nilai Siswa – '+cn(D.cur)+'</h1><div class="row"><button class="btn" onclick="upN()">Unggah Nilai</button><span style="color:var(--mu)">Bobot: '+CAT.map(k=>k+' '+W[k]+'%').join(' • ')+'</span></div><div class="card tw" style="margin-top:14px"><table><tr><th>Nama</th>'+CAT.map(k=>'<th>'+k+'</th>').join('')+'<th>Nilai Akhir</th></tr>'+(l.map(s=>'<tr><td>'+esc(s.name)+'</td>'+CAT.map(k=>'<td><input type="number" min="0" max="100" style="width:72px;padding:5px" value="'+(D.gr[s.id][k]??'')+'" onchange="setN(\''+s.id+'\',\''+k+'\',this.value)"></td>').join('')+'<td><b>'+fin(s.id)+'</b></td></tr>').join('')||'<tr><td colspan=8>'+empty('Belum ada siswa')+'</td></tr>')+'<tr><td><b>Rata-rata</b></td>'+rk.map(x=>'<td><b>'+x+'</b></td>').join('')+'<td><b>'+avg(l.map(s=>fin(s.id)))+'</b></td></tr></table></div><div class="card"><h2>Rata-rata per kategori</h2>'+bars(CAT.map((k,i)=>[k,rk[i]]),100)+'</div>'}
function setN(id,k,v){if(v===''){delete D.gr[id][k]}else{v=+v;if(v<0||v>100||isNaN(v))return toast('Nilai harus 0–100',false);D.gr[id][k]=v}save();toast('Nilai disimpan');render()}
function upN(){form('Unggah Nilai',[{k:'cat',l:'Kategori',t:'select',o:CAT},{k:'t',l:'Tempel data CSV: NIS,Nilai (satu per baris)',t:'area',r:1}],{},o=>{let n=0;o.t.split('\n').forEach(r=>{const[c,v]=r.split(',').map(x=>x.trim());const s=D.stu.find(x=>x.nis==c&&x.cls==D.cur);if(s&&v!==''&&+v>=0&&+v<=100){D.gr[s.id][o.cat]=+v;n++}});log(n+' nilai '+o.cat+' diunggah');toast(n+' nilai diunggah',n>0)})}
// Jadwal
let JD='';
function jadwal(){const l=D.sch.filter(s=>!JD||s.day==JD).sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||a.time.localeCompare(b.time));return '<h1>Jadwal Pelajaran</h1><div class="row">'+sel('j',[['','Semua hari']].concat(DAYS.map(d=>[d,d])),JD,'JD=this.value;render()')+'<button class="btn" onclick="addJ()">Tambah Jadwal</button></div><div class="card tw" style="margin-top:14px"><table><tr><th>Hari</th><th>Jam</th><th>Kelas</th><th>Materi</th><th>Ruang</th><th>Status</th><th></th></tr>'+(l.map(s=>'<tr><td>'+s.day+'</td><td>'+s.time+'</td><td>'+cn(s.cls)+'</td><td>'+esc(s.topic)+'</td><td>'+s.room+'</td><td><span class="tag">'+s.status+'</span></td><td><button class="btn s x" onclick="editJ(\''+s.id+'\')">Edit</button> <button class="btn d x" onclick="delJ(\''+s.id+'\')">Hapus</button></td></tr>').join('')||'<tr><td colspan=7>'+empty('Belum ada jadwal')+'</td></tr>')+'</table></div>'}
const JF=()=>[{k:'day',l:'Hari',t:'select',o:DAYS},{k:'time',l:'Jam (mis. 07:00-09:15)',r:1},{k:'cls',l:'Kelas',t:'select',o:D.cls.map(c=>[c.id,c.name])},{k:'topic',l:'Materi/pertemuan',r:1},{k:'room',l:'Ruang',r:1},{k:'status',l:'Status',t:'select',o:['Terjadwal','Terlaksana','Dibatalkan']}];
function addJ(){form('Tambah Jadwal',JF(),{cls:D.cur,status:'Terjadwal'},o=>{D.sch.push({id:uid(),...o});toast('Jadwal ditambahkan')})}
function editJ(id){const s=D.sch.find(x=>x.id==id);form('Edit Jadwal',JF(),s,o=>{Object.assign(s,o);toast('Jadwal diperbarui')})}
function delJ(id){ask('Hapus jadwal ini?',()=>{D.sch=D.sch.filter(s=>s.id!=id);save();render();toast('Jadwal dihapus')})}
// Pengaturan
function set(){const u=D.user;return '<h1>Pengaturan</h1><div class="g2"><div class="card"><h2>Profil guru</h2><p><b>'+u.name+', '+u.gelar+'</b><br>'+u.school+'<br>'+u.mapel+'<br>Username: '+u.username+'</p><button class="btn" onclick="editU()">Edit Profil</button> <button class="btn s" onclick="pwU()">Ubah Password</button></div><div class="card"><h2>Tampilan & notifikasi</h2><div class="row"><button class="btn '+(u.theme=='light'?'':'s')+'" onclick="thm(\'light\')">☀️ Light mode</button><button class="btn '+(u.theme=='dark'?'':'s')+'" onclick="thm(\'dark\')">🌙 Dark mode</button></div><label class="row"><input type="checkbox" style="width:auto" '+(u.notif?'checked':'')+' onchange="D.user.notif=this.checked;save();toast(\'Notifikasi diperbarui\')"> Aktifkan notifikasi</label></div><div class="card"><h2>Akses siswa</h2><p>Siswa membuka tautan khusus dan masuk dengan NIS untuk melihat data miliknya saja.</p><a class="btn l" href="#siswa" onclick="setTimeout(boot,50)">Buka Halaman Siswa</a></div><div class="card"><h2>Data</h2><button class="btn d" onclick="ask(\'Reset semua data ke data demo?\',()=>{D=seed();save();boot()})">Reset Data Demo</button></div></div>'}
function thm(t){D.user.theme=t;document.documentElement.dataset.theme=t;save();render()}
function editU(){form('Edit Profil',[{k:'name',l:'Nama',r:1},{k:'gelar',l:'Gelar'},{k:'username',l:'Username',r:1},{k:'school',l:'Sekolah'},{k:'mapel',l:'Mata pelajaran'},{k:'foto',l:'URL foto profil (opsional)'}],D.user,o=>{Object.assign(D.user,o);toast('Profil disimpan')})}
function pwU(){form('Ubah Password',[{k:'old',l:'Password lama',t:'password',r:1},{k:'nw',l:'Password baru (min. 6 karakter)',t:'password',r:1}],{},o=>{if(o.old!=D.user.pw||o.nw.length<6){toast('Password lama salah atau baru terlalu pendek',false);return}D.user.pw=o.nw;toast('Password diubah')})}
// Portal siswa
let SID=null;
function stuPortal(){document.documentElement.dataset.theme=D.user.theme;const s=SID&&stuOf(SID);
if(!s){$('#root').innerHTML='<div class="login"><div class="card lb"><div class="lg">🎓</div><h1>AKSI Siswa</h1><p style="color:var(--mu)">Masukkan NIS untuk melihat materi, kuis, dan nilai milikmu.</p><form onsubmit="event.preventDefault();const s=D.stu.find(x=>x.nis==$(\'#nis\').value.trim());if(s){SID=s.id;stuPortal()}else $(\'#e2\').textContent=\'NIS tidak ditemukan\'"><input id="nis" placeholder="NIS"><p id="e2" class="no"></p><button class="btn" style="width:100%">Lihat Data Saya</button></form><div class="hint">NIS demo: 20241 01 → <b>2024101</b></div><p><a href="#" onclick="setTimeout(boot,50)">← Halaman guru</a></p></div></div>';return}
const g=D.gr[s.id],m=getM(s.cls);$('#root').innerHTML='<div class="pg" style="margin:auto"><div class="card hero"><div class="av">🎓</div><div><h1 style="margin:0">'+esc(s.name)+'</h1>'+cn(s.cls)+' • NIS '+s.nis+'</div><button class="btn s" onclick="SID=null;stuPortal()" style="margin-left:auto">Keluar</button></div><div class="g2"><div class="card"><h2>Nilai saya</h2>'+CAT.map(k=>'<p>'+k+': <b>'+(g[k]??'-')+'</b></p>').join('')+'<p>Nilai akhir: <b>'+fin(s.id)+'</b></p></div><div class="card"><h2>Materi & kuis</h2>'+m.map((x,i)=>'<p>P'+x.n+': '+esc(x.title)+' <button class="btn x l" onclick="QM='+i+';takeQ(\''+s.id+'\')">Kerjakan Kuis</button></p>').join('')+'</div><div class="card"><h2>LKPD</h2>'+D.lk.map(l=>'<p>'+esc(l.title)+' <button class="btn x s" onclick="modal(\'<h2>\'+esc(D.lk.find(z=>z.id==\''+l.id+'\').title)+\'</h2>\'+lkH(D.lk.find(z=>z.id==\''+l.id+'\'),0)+\'<button class=btn onclick=closeM()>Tutup</button>\')">Buka</button></p>').join('')+'</div></div></div>'}
addEventListener('hashchange',boot);boot();
